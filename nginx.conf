server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /data/files/ {
        return 404;
    }

    location = /assets/api.js {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
